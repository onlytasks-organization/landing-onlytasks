<!DOCTYPE html>

    <link rel="stylesheet" href="styles.css" />

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="backdrop" aria-hidden="true">
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <div class="orb orb-c"></div>
      <div class="grid-fade"></div>
    </div>

    <div class="shell">
      <header class="top">
        <div class="brand-mark" aria-hidden="true"></div>
        <p class="domain">onlytasks.eu</p>
      </header>

      <main id="main" class="layout">
        <div class="panel">
          <p class="kicker">Coming soon</p>

            <p class="status-label">
              <strong class="status-label__lead">Coming soon</strong>
              <span class="status-label__rest"> — we are polishing what ships first.</span>
            </p>
          </div>
        </div>

        <div class="stage" aria-hidden="true">
          <div class="ring ring--1"></div>
          <div class="ring ring--2"></div>
          <div class="ring ring--3"></div>
          <div class="beam"></div>
        </div>
      </main>

      <footer class="footer">
        <p class="footer__copy">&copy; <span id="year">2026</span> Only Tasks</p>
      </footer>
    </div>

    <script>
      document.getElementById("year").textContent = String(new Date().getFullYear());
